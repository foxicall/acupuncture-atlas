name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Prepare Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Capacitor 8 Android SDK requirements
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Install locked dependencies
        run: npm ci
      - name: Validate source and native project
        run: |
          npm run check
          test -f android/gradlew
          test -f android/app/build.gradle
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const variables = readFileSync('android/variables.gradle', 'utf8');
          assert.match(variables, /compileSdkVersion\s*=\s*36\b/);
          assert.match(variables, /targetSdkVersion\s*=\s*36\b/);
          NODE
      - name: Build web assets and sync the checked-in Android project
        run: npm run cap:build
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: acupuncture-atlas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
